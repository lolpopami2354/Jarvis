<!DOCTYPE html>
<html>
<head>
    <title>JARVIS AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="stars"></div>

<div class="hud">

    <div class="title">
        J.A.R.V.I.S
        <span>ONLINE</span>
    </div>

    <div class="reactor">
        <div class="ring ring1"></div>
        <div class="ring ring2"></div>
        <div class="core"></div>
    </div>

    <div class="status">
        SYSTEM STATUS:
        <b>ACTIVE</b>
    </div>


    <div class="chat">
        <div id="messages">
            <p>JARVIS: Good morning. All systems are operational.</p>
        </div>

        <input id="input" placeholder="Speak to JARVIS...">
        <button onclick="sendMessage()">SEND</button>
    </div>


    <button class="voice" onclick="listen()">
        🎙 ACTIVATE VOICE
    </button>

</div>


<script src="script.js"></script>

</body>
</html>
